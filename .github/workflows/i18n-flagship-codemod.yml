name: I18N Final Migration Fixes

on:
  push:
    branches:
      - feat/bilingual-portfolio-en-es
    paths:
      - .github/workflows/i18n-flagship-codemod.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bilingual-portfolio-en-es
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply constrained migration
        run: python scripts/i18n-finalize.py
      - name: Verify migrated source
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          git diff --check
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(i18n): close release performance and frame regressions"
          git push origin HEAD:feat/bilingual-portfolio-en-es
