name: I18N Lock Sync

on:
  push:
    branches: [feat/bilingual-portfolio-en-es]
    paths:
      - ".github/workflows/i18n-lock-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bilingual-portfolio-en-es
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install next-intl and update lockfile
        run: npm install next-intl@4.13.7 --save-exact
      - name: Commit deterministic dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(i18n): lock next-intl 4.13.7 [lock-sync]"
          git push origin HEAD:feat/bilingual-portfolio-en-es
