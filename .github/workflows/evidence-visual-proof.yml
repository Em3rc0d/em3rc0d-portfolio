name: Evidence Visual Proof

on:
  push:
    branches: [develop]
    paths:
      - "src/app/evidence/**"
      - "src/app/evidence.css"
      - "src/components/evidence/**"
      - "src/content/evidence.ts"
      - "src/content/cv-engine-evidence.ts"
      - "src/content/evidence-index.ts"
      - "src/lib/content/types.ts"
      - "scripts/capture-browser-section.mjs"
      - ".github/workflows/evidence-visual-proof.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/build-room-next.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/evidence > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/build-room-next.log
          exit 1

      - name: Resolve and start Chrome CDP
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/build-room-evidence-chrome \
            about:blank > /tmp/evidence-chrome.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:9222/json/version > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/evidence-chrome.log
          exit 1

      - name: Capture Evidence intro desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/evidence '.evidence-library-intro' evidence-intro-desktop.png 1440 1000

      - name: Capture Evidence records desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/evidence '.evidence-record-list' evidence-records-desktop.png 1440 1000

      - name: Capture AutoPulse dossier desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/evidence/e-ap-06 '.evidence-inspector-sheet' evidence-autopulse-dossier-desktop.png 1440 1000

      - name: Capture CV Engine dossier desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/evidence/e-cv-12 '.evidence-inspector-sheet' evidence-cv-engine-dossier-desktop.png 1440 1000

      - name: Capture Evidence records mobile
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/evidence '.evidence-record-list' evidence-records-mobile.png 390 844

      - name: Capture CV Engine dossier mobile
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/evidence/e-cv-12 '.evidence-inspector-sheet' evidence-cv-engine-dossier-mobile.png 390 844

      - name: Upload Evidence proof
        uses: actions/upload-artifact@v4
        with:
          name: evidence-section-visual-proof
          path: |
            evidence-intro-desktop.png
            evidence-records-desktop.png
            evidence-autopulse-dossier-desktop.png
            evidence-cv-engine-dossier-desktop.png
            evidence-records-mobile.png
            evidence-cv-engine-dossier-mobile.png
          retention-days: 30
