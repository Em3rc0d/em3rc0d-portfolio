name: AutoPulse Visual Proof

on:
  push:
    branches: [develop]
    paths:
      - "src/app/autopulse*.css"
      - "src/components/systems/autopulse/**"
      - "src/content/autopulse.ts"
      - "src/app/systems/[slug]/page.tsx"
      - ".github/workflows/autopulse-visual-proof.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/build-room-next.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/systems/autopulse > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/build-room-next.log
          exit 1

      - name: Resolve Chrome
        id: chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "binary=$CHROME_BIN" >> "$GITHUB_OUTPUT"

      - name: Capture AutoPulse full desktop composition
        run: |
          "${{ steps.chrome.outputs.binary }}" \
            --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-prefers-reduced-motion=reduce \
            --window-size=1440,9000 \
            --virtual-time-budget=1200 \
            --screenshot=autopulse-full-desktop.png \
            http://127.0.0.1:3000/systems/autopulse

      - name: Capture AutoPulse full mobile composition
        run: |
          "${{ steps.chrome.outputs.binary }}" \
            --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-prefers-reduced-motion=reduce \
            --window-size=390,9000 \
            --virtual-time-budget=1200 \
            --screenshot=autopulse-full-mobile.png \
            http://127.0.0.1:3000/systems/autopulse

      - name: Upload AutoPulse proof
        uses: actions/upload-artifact@v4
        with:
          name: autopulse-full-visual-proof
          path: |
            autopulse-full-desktop.png
            autopulse-full-mobile.png
          retention-days: 30
