name: Visual Proof

on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/visual-proof.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/build-room-next.log 2>&1 &
          echo $! > /tmp/build-room-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/build-room-next.log
          exit 1

      - name: Resolve Chrome
        id: chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found on runner"
            exit 1
          fi
          echo "binary=$CHROME_BIN" >> "$GITHUB_OUTPUT"

      - name: Capture desktop after startup
        run: |
          "${{ steps.chrome.outputs.binary }}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1000 \
            --virtual-time-budget=3500 \
            --screenshot=home-desktop.png \
            http://127.0.0.1:3000/

      - name: Capture mobile after startup
        run: |
          "${{ steps.chrome.outputs.binary }}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=390,844 \
            --virtual-time-budget=3500 \
            --screenshot=home-mobile.png \
            http://127.0.0.1:3000/

      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: build-room-home-visual-proof
          path: |
            home-desktop.png
            home-mobile.png
          retention-days: 14
