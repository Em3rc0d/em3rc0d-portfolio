name: Visual Proof

on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "scripts/capture-browser-section.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/visual-proof.yml"
  pull_request:
    branches: [develop]
    paths:
      - "src/**"
      - "scripts/capture-browser-section.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/visual-proof.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/build-room-next.log 2>&1 &
          echo $! > /tmp/build-room-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/build-room-next.log
          exit 1

      - name: Resolve Chrome
        id: chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found on runner"
            exit 1
          fi
          echo "binary=$CHROME_BIN" >> "$GITHUB_OUTPUT"

      - name: Capture desktop startup state
        run: |
          "${{ steps.chrome.outputs.binary }}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=1200 --screenshot=startup-desktop.png http://127.0.0.1:3000/

      - name: Capture mobile startup state
        run: |
          "${{ steps.chrome.outputs.binary }}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=1200 --screenshot=startup-mobile.png http://127.0.0.1:3000/

      - name: Capture desktop settled Home
        run: |
          "${{ steps.chrome.outputs.binary }}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-prefers-reduced-motion=reduce --window-size=1440,1000 --virtual-time-budget=800 --screenshot=home-desktop.png http://127.0.0.1:3000/

      - name: Capture mobile settled Home
        run: |
          "${{ steps.chrome.outputs.binary }}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-prefers-reduced-motion=reduce --window-size=390,844 --virtual-time-budget=800 --screenshot=home-mobile.png http://127.0.0.1:3000/

      - name: Capture AutoPulse cover desktop
        run: |
          "${{ steps.chrome.outputs.binary }}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-prefers-reduced-motion=reduce --window-size=1440,1000 --virtual-time-budget=800 --screenshot=autopulse-cover-desktop.png http://127.0.0.1:3000/systems/autopulse

      - name: Capture AutoPulse cover mobile
        run: |
          "${{ steps.chrome.outputs.binary }}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-prefers-reduced-motion=reduce --window-size=390,844 --virtual-time-budget=800 --screenshot=autopulse-cover-mobile.png http://127.0.0.1:3000/systems/autopulse

      - name: Start Chrome CDP for section captures
        run: |
          "${{ steps.chrome.outputs.binary }}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/build-room-visual-cdp about:blank \
            > /tmp/build-room-visual-cdp.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9222/json/version > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/build-room-visual-cdp.log
          exit 1

      - name: Capture mobile Home signature object
        run: |
          node scripts/capture-browser-section.mjs \
            http://127.0.0.1:3000/ \
            '.signature-assembly' \
            home-signature-mobile.png \
            390 844

      - name: Capture AutoPulse architecture desktop
        run: |
          node scripts/capture-browser-section.mjs \
            http://127.0.0.1:3000/systems/autopulse \
            '#architecture' \
            autopulse-architecture-desktop.png \
            1440 1000

      - name: Capture AutoPulse verification desktop
        run: |
          node scripts/capture-browser-section.mjs \
            http://127.0.0.1:3000/systems/autopulse \
            '#verification' \
            autopulse-verification-desktop.png \
            1440 1000

      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: build-room-visual-proof
          path: |
            startup-desktop.png
            startup-mobile.png
            home-desktop.png
            home-mobile.png
            home-signature-mobile.png
            autopulse-cover-desktop.png
            autopulse-cover-mobile.png
            autopulse-architecture-desktop.png
            autopulse-verification-desktop.png
          retention-days: 30
