name: Public Surfaces Visual Proof

on:
  push:
    branches: [develop]
    paths:
      - "src/app/notes/**"
      - "src/app/about/**"
      - "src/app/contact/**"
      - "src/app/public-surfaces.css"
      - "src/components/notes/**"
      - "src/content/notes.ts"
      - "src/lib/content/types.ts"
      - "scripts/capture-browser-section.mjs"
      - ".github/workflows/public-surfaces-visual-proof.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/build-room-next.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/notes > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/build-room-next.log
          exit 1

      - name: Resolve and start Chrome CDP
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/build-room-public-chrome \
            about:blank > /tmp/public-chrome.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:9222/json/version > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/public-chrome.log
          exit 1

      - name: Capture Notes index desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/notes '.notes-index-intro' notes-index-desktop.png 1440 1000

      - name: Capture Notes ledger desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/notes '.notes-ledger' notes-ledger-desktop.png 1440 1000

      - name: Capture Built Verified note desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/notes/no-data-is-not-zero '.note-sheet' note-built-desktop.png 1440 1000

      - name: Capture Exploring note desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/notes/when-does-a-listing-become-one-opportunity '.note-sheet' note-exploring-desktop.png 1440 1000

      - name: Capture About hero desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/about '.about-hero' about-hero-desktop.png 1440 1000

      - name: Capture About operating sequence desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/about '.about-sequence' about-sequence-desktop.png 1440 1000

      - name: Capture About mechanical note desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/about '.about-mechanical-note' about-mechanical-desktop.png 1440 1000

      - name: Capture Contact hero desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/contact '.contact-hero' contact-hero-desktop.png 1440 1000

      - name: Capture Contact intake desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/contact '.contact-intake' contact-intake-desktop.png 1440 1000

      - name: Capture Contact channels desktop
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/contact '.contact-channels' contact-channels-desktop.png 1440 1000

      - name: Capture Notes mobile
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/notes '.notes-index-intro' notes-mobile.png 390 844

      - name: Capture Exploring note mobile
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/notes/when-does-a-listing-become-one-opportunity '.note-sheet' note-exploring-mobile.png 390 844

      - name: Capture About mobile
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/about '.about-hero' about-mobile.png 390 844

      - name: Capture Contact mobile
        run: node scripts/capture-browser-section.mjs http://127.0.0.1:3000/contact '.contact-hero' contact-mobile.png 390 844

      - name: Upload public surfaces proof
        uses: actions/upload-artifact@v4
        with:
          name: public-surfaces-visual-proof
          path: |
            notes-index-desktop.png
            notes-ledger-desktop.png
            note-built-desktop.png
            note-exploring-desktop.png
            about-hero-desktop.png
            about-sequence-desktop.png
            about-mechanical-desktop.png
            contact-hero-desktop.png
            contact-intake-desktop.png
            contact-channels-desktop.png
            notes-mobile.png
            note-exploring-mobile.png
            about-mobile.png
            contact-mobile.png
          retention-days: 30
