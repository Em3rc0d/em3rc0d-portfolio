name: Frame Discipline

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "scripts/frame-discipline-smoke.mjs"
      - ".github/workflows/frame-discipline.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "scripts/frame-discipline-smoke.mjs"
      - ".github/workflows/frame-discipline.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/build-room-next.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/build-room-next.log
          exit 1

      - name: Resolve and start Chrome CDP
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/build-room-frame-chrome \
            about:blank > /tmp/frame-chrome.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:9222/json/version > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/frame-chrome.log
          exit 1

      - name: Enforce one-frame one-section contract
        shell: bash
        run: |
          set -o pipefail
          node scripts/frame-discipline-smoke.mjs 2>&1 | tee frame-discipline.log

      - name: Upload frame discipline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-discipline-report
          path: frame-discipline.log
          retention-days: 30
